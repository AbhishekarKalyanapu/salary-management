spring:
  application:
    name: salary-management
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=salary;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Admin#123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
