server {
    listen 80;
    server_name _;
    client_header_buffer_size 16k;
  large_client_header_buffers 4 32k;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://salary-management-backend.ambitiousisland-ea49543b.centralindia.azurecontainerapps.io;
proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host salary-management-backend.ambitiousisland-ea49543b.centralindia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}