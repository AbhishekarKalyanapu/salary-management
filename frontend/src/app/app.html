<div class="app-container">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">₹</span>
      <span>Salary Management</span>
    </div>
  </header>

  <div class="main-layout">

    <aside class="sidebar">

      <nav>

        <a routerLink="/dashboard"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          <span>📊</span>
          Dashboard
        </a>

        <a routerLink="/employees"
           routerLinkActive="active">
          <span>👥</span>
          Employees
        </a>

        <a routerLink="/salary"
           routerLinkActive="active">
          <span>💰</span>
          Salary
        </a>

        <a routerLink="/insights"
           routerLinkActive="active">
          <span>📈</span>
          Insights
        </a>

        <a routerLink="/csv"
           routerLinkActive="active">
          <span>📁</span>
          CSV Import / Export
        </a>

      </nav>

    </aside>

    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
