services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Str0ng!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Str0ng!Passw0rd}"
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('salary') IS NULL CREATE DATABASE salary"
    restart: "no"

  backend:
    image: salary-management-backend:latest
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=salary;encrypt=true;trustServerCertificate=true"
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD:-Str0ng!Passw0rd}"
      PORT: "8080"
    ports:
      - "8080:8080"

  frontend:
    image: salary-management-frontend:latest
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mssql-data: